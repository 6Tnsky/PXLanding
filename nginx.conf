server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # любой неизвестный путь отдаёт index.html (одностраничник с якорями)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # кэш статики; index.html всегда свежий
    location ~* \.(css|js|webp|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # служебные файлы наружу не отдаём
    location ~ /\.(?!well-known) {
        deny all;
    }

    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript image/svg+xml;
}
